<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meet Reffy | Club Pilates</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --midnight: #0F0F0F;
      --steel: #4F7CAC;
      --gold: #C8A96E;
      --cream: #FAF9F6;
      --warm-gray: #E8E4DD;
      --muted: #8A8580;
      --reffy-bubble: #F0EDE6;
      --user-bubble: #4F7CAC;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--midnight);
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero {
      width: 100%;
      background: var(--midnight);
      padding: 28px 24px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(200,169,110,0.08);
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -40px; left: -40px;
      width: 140px; height: 140px;
      border-radius: 50%;
      background: rgba(79,124,172,0.1);
    }

    .studio-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
      opacity: 0.9;
      position: relative;
      z-index: 1;
    }

    .reffy-avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      margin: 0 auto 12px;
      position: relative;
      z-index: 1;
      border: 3px solid rgba(200,169,110,0.4);
      box-shadow: 0 0 0 6px rgba(200,169,110,0.1);
      overflow: hidden;
      background: #C8A96E;
    }
    .reffy-avatar img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }

    .reffy-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--cream);
      letter-spacing: 0.02em;
      position: relative;
      z-index: 1;
    }

    .reffy-tagline {
      font-size: 13px;
      color: rgba(250,249,246,0.55);
      margin-top: 4px;
      font-weight: 300;
      letter-spacing: 0.01em;
      position: relative;
      z-index: 1;
    }

    .chat-container {
      width: 100%;
      max-width: 620px;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 0 120px;
    }

    .messages {
      flex: 1;
      padding: 20px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      animation: fadeUp 0.3s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .avatar-sm {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .bubble {
      max-width: 78%;
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.55;
      font-weight: 400;
    }

    .bubble.reffy {
      background: var(--reffy-bubble);
      color: var(--midnight);
      border-bottom-left-radius: 4px;
    }

    .bubble.user {
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bubble a { color: var(--steel); font-weight: 500; text-decoration: underline; }
    .bubble.user a { color: rgba(255,255,255,0.9); }

    .typing-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-5px); }
    }

    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px 16px 8px 52px;
      animation: fadeUp 0.3s ease 0.15s both;
    }

    .qr-btn {
      background: white;
      border: 1px solid var(--warm-gray);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      color: var(--steel);
      cursor: pointer;
      transition: all 0.15s ease;
      font-weight: 500;
    }

    .qr-btn:hover { background: var(--steel); color: white; border-color: var(--steel); }

    .input-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--cream);
      border-top: 1px solid var(--warm-gray);
      padding: 12px 16px 20px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      z-index: 10;
    }

    .input-wrap {
      flex: 1;
      background: white;
      border: 1px solid var(--warm-gray);
      border-radius: 24px;
      display: flex;
      align-items: flex-end;
      padding: 10px 16px;
      gap: 8px;
      transition: border-color 0.2s;
    }

    .input-wrap:focus-within { border-color: var(--steel); }

    #user-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 14.5px;
      color: var(--midnight);
      resize: none;
      max-height: 100px;
      line-height: 1.4;
      min-height: 20px;
    }

    #user-input::placeholder { color: var(--muted); }

    .send-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--steel);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    .send-btn:hover  { background: #3d6a9a; }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { background: var(--warm-gray); cursor: not-allowed; }
    .send-btn svg { width: 16px; height: 16px; fill: white; }

    .human-bar {
      text-align: center;
      padding: 0 0 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .human-bar button {
      background: none;
      border: none;
      color: var(--steel);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
      font-weight: 500;
    }

    .human-form {
      background: white;
      border: 1px solid var(--warm-gray);
      border-radius: 14px;
      padding: 16px;
      margin: 4px 16px;
      animation: fadeUp 0.3s ease;
    }

    .human-form h4 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--midnight);
    }

    .human-form input {
      width: 100%;
      border: 1px solid var(--warm-gray);
      border-radius: 8px;
      padding: 9px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--midnight);
      outline: none;
      transition: border-color 0.2s;
      background: var(--cream);
    }

    .human-form input:focus { border-color: var(--steel); }

    .human-form .submit-btn {
      width: 100%;
      background: var(--midnight);
      color: var(--cream);
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .human-form .submit-btn:hover { opacity: 0.82; }

    .success-note {
      background: #EEF7EE;
      border: 1px solid #C3DEC3;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: #2D6A2D;
      margin: 4px 16px;
      text-align: center;
      animation: fadeUp 0.3s ease;
    }

    .video-section {
      width: 100%;
      max-width: 620px;
      padding: 20px 16px 4px;
    }

    .video-player {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: var(--midnight);
      cursor: pointer;
    }

    .video-player img.video-thumb {
      width: 100%;
      display: block;
      max-height: 340px;
      object-fit: cover;
      object-position: center 30%;
      transition: opacity 0.2s;
    }

    .video-player video {
      width: 100%;
      display: none;
      max-height: 340px;
      object-fit: cover;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.25);
      transition: background 0.2s;
    }

    .play-overlay:hover { background: rgba(0,0,0,0.35); }

    .play-btn-circle {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: transform 0.15s;
    }

    .play-btn-circle:hover { transform: scale(1.08); }

    .play-btn-circle svg {
      width: 24px; height: 24px;
      fill: var(--midnight);
      margin-left: 3px;
    }

    .skip-bar {
      display: flex;
      justify-content: center;
      padding: 10px 0 4px;
    }

    .skip-bar button {
      background: none;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      text-decoration: underline;
    }

    .chat-container.hidden { display: none; }
  </style>
</head>
<body>
<div class="page">

  <div class="hero">
    <div class="studio-label" id="studio-label">Club Pilates</div>
    <div class="reffy-avatar"><img src="reffy-avatar.png" alt="Reffy" /></div>
    <div class="reffy-name">Hi, I'm Reffy!</div>
    <div class="reffy-tagline">Your friendly Pilates guide — here to help, no pressure</div>
  </div>

  <div style="text-align:center; padding: 8px 24px 0; font-size: 11px; color: #8A8580; font-family: 'DM Sans', sans-serif;">
    Reffy is an AI guide. Answers are helpful but not guaranteed — our team is always happy to confirm details.
  </div>

  <div class="video-section" id="video-section">
    <div class="video-player" id="video-player" onclick="startVideo()">
      <img class="video-thumb" src="reffy-avatar.png" alt="Meet Reffy" id="video-thumb" />
      <video id="reffy-video" playsinline>
        <source src="reffy-intro.mp4" type="video/mp4" />
      </video>
      <div class="play-overlay" id="play-overlay">
        <div class="play-btn-circle">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
    </div>
    <div class="skip-bar">
      <button onclick="skipToChat()">Skip intro and start chatting →</button>
    </div>
  </div>

  <div class="chat-container hidden" id="chat-container">
    <div class="messages" id="messages"></div>
    <div id="quick-replies-area"></div>
    <div id="human-form-area"></div>
  </div>

  <div class="input-bar">
    <div style="flex:1; display:flex; flex-direction:column; gap:0;">
      <div class="human-bar">
        Prefer a real person? <button onclick="showHumanForm()">Request a team member</button>
      </div>
      <div class="input-wrap">
        <textarea id="user-input" placeholder="Type a message..." rows="1"></textarea>
      </div>
    </div>
    <button class="send-btn" id="send-btn">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>

</div>

<script>
  // ── URL params ───────────────────────────────────────────────────────────────
  const urlParams    = new URLSearchParams(window.location.search);
  const pathParts = window.location.pathname.split("/").filter(Boolean);
  const rawName = urlParams.get("name") || pathParts[1] || "";
  const prospectName = rawName.charAt(0).toUpperCase() + rawName.slice(1).toLowerCase();
  const studioParam  = urlParams.get("studio") || (pathParts[0] && pathParts[0] !== "generate" ? pathParts[0] : "missionvalley");

  const STUDIO_LABELS = {
    missionvalley: 'Club Pilates · Mission Valley, San Diego',
    lamesa:        'Club Pilates · La Mesa, San Diego',
    northpark:     'Club Pilates · North Park, San Diego',
    santee:        'Club Pilates · Santee, San Diego',
  };

  const STUDIO_NAMES = {
    missionvalley: 'Club Pilates Mission Valley',
    lamesa:        'Club Pilates La Mesa',
    northpark:     'Club Pilates North Park',
    santee:        'Club Pilates Santee',
  };

  // Set hero and page title dynamically
  document.getElementById('studio-label').textContent =
    STUDIO_LABELS[studioParam] || STUDIO_LABELS['missionvalley'];
  document.title = 'Meet Reffy | ' + (STUDIO_NAMES[studioParam] || 'Club Pilates');

  let studioName = STUDIO_NAMES[studioParam] || STUDIO_NAMES['missionvalley'];
  let messages = [];
  let isLoading = false;
  let transcriptSent = false;
  let inactivityTimer = null;

  // ── Render helpers ───────────────────────────────────────────────────────────
  function addMessage(role, text) {
    messages.push({ role, content: text });
    renderMessage(role, text);
  }

  function renderMessage(role, text) {
    const container = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg-row ' + (role === 'user' ? 'user' : 'reffy');
    if (role !== 'user') {
      const av = document.createElement('div');
      av.className = 'avatar-sm';
      av.innerHTML = '<img src="reffy-avatar.png" alt="Reffy" style="width:100%;height:100%;object-fit:cover;object-position:center 20%;border-radius:50%;"/>';
      row.appendChild(av);
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'reffy');
    bubble.innerHTML = formatText(text);
    row.appendChild(bubble);
    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
  }

  function getLinkLabel(url) {
    if (url.includes('319010'))            return 'Sign up — Single Class ($35) →';
    if (url.includes('289684'))            return 'Sign up — 4 Class Pack ($109/mo) →';
    if (url.includes('289686'))            return 'Sign up — 8 Class Pack ($199/mo) →';
    if (url.includes('377181'))            return 'Sign up — Unlimited ($259/mo) →';
    if (url.includes('clubready.com'))     return 'Sign up for membership →';
    if (url.includes('lp.clubpilates.com'))return 'Book your free Intro class →';
    if (url.includes('clubpilates.com/book')) return 'Book your free Intro class →';
    if (url.includes('apps.apple.com'))    return 'Download on the App Store →';
    if (url.includes('play.google.com'))   return 'Get it on Google Play →';
    if (url.includes('clubpilates.com/location')) return 'View full schedule →';
    if (url.includes('tinyurl.com'))       return 'Get directions →';
    return 'Learn more →';
  }

  function formatText(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/(https?:\/\/[^\s<)]+)/g, (url) =>
        `<a href="${url}" target="_blank" rel="noopener">${getLinkLabel(url)}</a>`)
      .replace(/\n/g, '<br>');
  }

  function showTyping() {
    const container = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg-row reffy';
    row.id = 'typing-indicator';
    const av = document.createElement('div');
    av.className = 'avatar-sm';
    av.innerHTML = '<img src="reffy-avatar.png" alt="Reffy" style="width:100%;height:100%;object-fit:cover;object-position:center 15%;border-radius:50%;" />';
    row.appendChild(av);
    const bubble = document.createElement('div');
    bubble.className = 'bubble reffy';
    bubble.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
    row.appendChild(bubble);
    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  // ── Quick replies ────────────────────────────────────────────────────────────
  function showQuickReplies(replies) {
    const area = document.getElementById('quick-replies-area');
    area.innerHTML = '';
    if (!replies || replies.length === 0) return;
    const wrap = document.createElement('div');
    wrap.className = 'quick-replies';
    replies.forEach(r => {
      const btn = document.createElement('button');
      btn.className = 'qr-btn';
      btn.textContent = r;
      btn.onclick = () => { area.innerHTML = ''; sendUserMessage(r); };
      wrap.appendChild(btn);
    });
    area.appendChild(wrap);
  }

  // ── API call — passes studio + prospectName ──────────────────────────────────
  async function callReffy() {
    const res = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages,
        studio: studioParam,
        prospectName: prospectName,
      }),
    });
    const data = await res.json();
    if (data.studioName) studioName = data.studioName;
    return {
      reply:        data.reply        || "Something glitched — try again!",
      quickReplies: data.quickReplies || [],
    };
  }

  // ── Send flow ────────────────────────────────────────────────────────────────
  async function sendUserMessage(text) {
    if (!text.trim() || isLoading) return;
    isLoading = true;
    document.getElementById('send-btn').disabled = true;
    document.getElementById('quick-replies-area').innerHTML = '';

    addMessage('user', text);
    showTyping();
    resetInactivityTimer();

    try {
      const { reply, quickReplies } = await callReffy();
      removeTyping();
      addMessage('assistant', reply);
      if (!transcriptSent && messages.length >= 4) {
        transcriptSent = true;
        submitTranscript(prospectName, 'booking link sent', '', '');
      }
      if (quickReplies && quickReplies.length > 0) showQuickReplies(quickReplies);
    } catch (e) {
      removeTyping();
      addMessage('assistant', "Oops — something glitched on my end! Try sending that again.");
    }

    isLoading = false;
    document.getElementById('send-btn').disabled = false;
  }

  function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    sendUserMessage(text);
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  // ── Human form ───────────────────────────────────────────────────────────────
  function showHumanForm() {
    const area = document.getElementById('human-form-area');
    if (area.querySelector('.human-form')) return;
    area.innerHTML = `
      <div class="human-form">
        <h4>Connect with our team 💙</h4>
        <input type="text"  id="hf-name"  placeholder="Last name" />
        
        
        <p style="font-size:13px; color:#8A8580; margin-bottom:8px;">How would you prefer we reach out?</p>
        <div style="display:flex; gap:8px; margin-bottom:12px;">
          <label style="flex:1; display:flex; align-items:center; gap:7px; background:#FAF9F6; border:1px solid #E8E4DD; border-radius:8px; padding:9px 12px; cursor:pointer; font-size:13px; font-weight:500;">
            <input type="radio" name="contact-pref" value="text" checked style="accent-color:#4F7CAC; width:15px; height:15px;" /> Text me
          </label>
          <label style="flex:1; display:flex; align-items:center; gap:7px; background:#FAF9F6; border:1px solid #E8E4DD; border-radius:8px; padding:9px 12px; cursor:pointer; font-size:13px; font-weight:500;">
            <input type="radio" name="contact-pref" value="call" style="accent-color:#4F7CAC; width:15px; height:15px;" /> Call me
          </label>
        </div>
        <button class="submit-btn" onclick="submitHumanRequest()">Send my info to the studio</button>
      </div>`;
    area.scrollIntoView({ behavior: 'smooth' });
  }

  function submitHumanRequest() {
    const name   = document.getElementById('hf-name').value.trim();
    
    
    const prefEl = document.querySelector('input[name="contact-pref"]:checked');
    const pref   = prefEl ? prefEl.value : 'text';
    if (!name) {
      alert('Please enter your last name so we can find you in our system!');
      return;
    }
    const prefLabel = pref === 'call' ? 'give you a call' : 'send you a text';
    submitTranscript(name, pref, "", "");
    document.getElementById('human-form-area').innerHTML =
      `<div class="success-note">Got it, ${name}! Someone from ${studioName} will ${prefLabel} within 24 hours. So excited to meet you!</div>`;
    addMessage('assistant', `Perfect! I've sent your info to the team, ${name}. They'll ${prefLabel} within 24 hours — they're so excited to meet you! 🎉`);
  }

  // ── Init — opening message comes from AI ─────────────────────────────────────
  async function init() {
    showTyping();
    try {
      const { reply, quickReplies } = await callReffy();
      removeTyping();
      addMessage('assistant', reply);
      if (quickReplies && quickReplies.length > 0) showQuickReplies(quickReplies);
    } catch(e) {
      removeTyping();
      const greeting = prospectName
        ? `Hey ${prospectName}! I'm Reffy, your friendly guide here at ${studioName}. What brings you here today?`
        : `Hey there! I'm Reffy, your friendly guide here at ${studioName}. What brings you here today?`;
      addMessage('assistant', greeting);
      showQuickReplies(["First time curious!", "I've tried Pilates before", "A friend recommended it", "Tell me more first"]);
    }
  }

  // ── Transcript ───────────────────────────────────────────────────────────────
  async function submitTranscript(pName, contactPref, phone, email) {
    const transcript = messages
      .map(m => (m.role === 'user' ? 'PROSPECT: ' : 'REFFY: ') + m.content)
      .join('\n\n');
    try {
      await fetch('/.netlify/functions/transcript', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prospectName: pName || 'Unknown',
          contactPref:  contactPref || 'Not specified',
          phone:        phone || 'Not provided',
          email:        email || 'Not provided',
          studio:       studioParam,
          studioName:   studioName,
          transcript,
          timestamp: new Date().toLocaleString('en-US', { timeZone: 'America/Los_Angeles' }),
        }),
      });
    } catch(e) {
      console.log('Transcript submit error:', e);
    }
  }

  document.getElementById('user-input').addEventListener('keydown', handleKey);
  document.getElementById('user-input').addEventListener('input', function() { autoResize(this); });
  document.getElementById('send-btn').addEventListener('click', sendMessage);

  // ── Session-end transcript ───────────────────────────────────────────────────
  function sendSessionTranscript() {
    if (transcriptSent || messages.length < 2) return;
    transcriptSent = true;
    submitTranscript(prospectName, 'session ended', '', '');
  }

  function resetInactivityTimer() {
    clearTimeout(inactivityTimer);
    inactivityTimer = setTimeout(sendSessionTranscript, 10 * 60 * 1000);
  }

  window.addEventListener('beforeunload', sendSessionTranscript);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') sendSessionTranscript();
  });
  document.addEventListener('click', resetInactivityTimer);
  document.addEventListener('keydown', resetInactivityTimer);

  // ── Video player ─────────────────────────────────────────────────────────────
  let chatStarted = false;

  function startVideo() {
    const vid     = document.getElementById('reffy-video');
    const thumb   = document.getElementById('video-thumb');
    const overlay = document.getElementById('play-overlay');
    const player  = document.getElementById('video-player');
    thumb.style.display   = 'none';
    overlay.style.display = 'none';
    vid.style.display     = 'block';
    player.style.cursor   = 'default';
    player.onclick        = null;
    vid.addEventListener('ended', skipToChat);
    vid.play().catch(() => skipToChat());
  }

  function skipToChat() {
    if (chatStarted) return;
    chatStarted = true;
    const vs = document.getElementById('video-section');
    const cc = document.getElementById('chat-container');
    if (vs) vs.style.display = 'none';
    if (cc) cc.classList.remove('hidden');
    init();
  }
</script>
</body>
</html>

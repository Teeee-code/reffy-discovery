<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meet Reffy | Club Pilates Mission Valley</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --midnight: #0F0F0F;
      --steel: #4F7CAC;
      --gold: #C8A96E;
      --cream: #FAF9F6;
      --warm-gray: #E8E4DD;
      --muted: #8A8580;
      --reffy-bubble: #F0EDE6;
      --user-bubble: #4F7CAC;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--midnight);
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Hero ── */
    .hero {
      width: 100%;
      background: var(--midnight);
      padding: 28px 24px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(200,169,110,0.08);
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -40px; left: -40px;
      width: 140px; height: 140px;
      border-radius: 50%;
      background: rgba(79,124,172,0.1);
    }

    .studio-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
      opacity: 0.9;
      position: relative;
      z-index: 1;
    }

    .reffy-avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      margin: 0 auto 12px;
      position: relative;
      z-index: 1;
      border: 3px solid rgba(200,169,110,0.4);
      box-shadow: 0 0 0 6px rgba(200,169,110,0.1);
      overflow: hidden;
      background: #C8A96E;
    }
    .reffy-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }

    .reffy-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--cream);
      letter-spacing: 0.02em;
      position: relative;
      z-index: 1;
    }

    .reffy-tagline {
      font-size: 13px;
      color: rgba(250,249,246,0.55);
      margin-top: 4px;
      font-weight: 300;
      letter-spacing: 0.01em;
      position: relative;
      z-index: 1;
    }

    /* ── Chat ── */
    .chat-container {
      width: 100%;
      max-width: 620px;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 0 120px;
    }

    .messages {
      flex: 1;
      padding: 20px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      animation: fadeUp 0.3s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .avatar-sm {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .bubble {
      max-width: 78%;
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.55;
      font-weight: 400;
    }

    .bubble.reffy {
      background: var(--reffy-bubble);
      color: var(--midnight);
      border-bottom-left-radius: 4px;
    }

    .bubble.user {
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bubble a {
      color: var(--steel);
      font-weight: 500;
      text-decoration: underline;
    }

    .bubble.user a { color: rgba(255,255,255,0.9); }

    /* ── Typing indicator ── */
    .typing-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-5px); }
    }

    /* ── Quick replies ── */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px 16px 8px 52px;
      animation: fadeUp 0.3s ease 0.15s both;
    }

    .qr-btn {
      background: white;
      border: 1px solid var(--warm-gray);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      color: var(--steel);
      cursor: pointer;
      transition: all 0.15s ease;
      font-weight: 500;
    }

    .qr-btn:hover {
      background: var(--steel);
      color: white;
      border-color: var(--steel);
    }

    /* ── Input bar ── */
    .input-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--cream);
      border-top: 1px solid var(--warm-gray);
      padding: 12px 16px 20px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      z-index: 10;
    }

    .input-wrap {
      flex: 1;
      background: white;
      border: 1px solid var(--warm-gray);
      border-radius: 24px;
      display: flex;
      align-items: flex-end;
      padding: 10px 16px;
      gap: 8px;
      transition: border-color 0.2s;
    }

    .input-wrap:focus-within { border-color: var(--steel); }

    #user-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 14.5px;
      color: var(--midnight);
      resize: none;
      max-height: 100px;
      line-height: 1.4;
      min-height: 20px;
    }

    #user-input::placeholder { color: var(--muted); }

    .send-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--steel);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    .send-btn:hover  { background: #3d6a9a; }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { background: var(--warm-gray); cursor: not-allowed; }

    .send-btn svg { width: 16px; height: 16px; fill: white; }

    .human-bar {
      text-align: center;
      padding: 0 0 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .human-bar button {
      background: none;
      border: none;
      color: var(--steel);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
      font-weight: 500;
    }

    /* ── Human form ── */
    .human-form {
      background: white;
      border: 1px solid var(--warm-gray);
      border-radius: 14px;
      padding: 16px;
      margin: 4px 16px;
      animation: fadeUp 0.3s ease;
    }

    .human-form h4 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--midnight);
    }

    .human-form input {
      width: 100%;
      border: 1px solid var(--warm-gray);
      border-radius: 8px;
      padding: 9px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--midnight);
      outline: none;
      transition: border-color 0.2s;
      background: var(--cream);
    }

    .human-form input:focus { border-color: var(--steel); }

    .human-form .submit-btn {
      width: 100%;
      background: var(--midnight);
      color: var(--cream);
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .human-form .submit-btn:hover { opacity: 0.82; }

    .success-note {
      background: #EEF7EE;
      border: 1px solid #C3DEC3;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: #2D6A2D;
      margin: 4px 16px;
      text-align: center;
      animation: fadeUp 0.3s ease;
    }


  </style>
</head>
<body>
<div class="page">

  <div class="hero">
    <div class="studio-label">Club Pilates · Mission Valley, San Diego</div>
    <div class="reffy-avatar"><img src="reffy-avatar.png" alt="Reffy" /></div>
    <div class="reffy-name">Hi, I'm Reffy!</div>
    <div class="reffy-tagline">Your friendly Pilates guide — here to help, no pressure</div>
  </div>

  <div class="chat-container" id="chat-container">
    <div class="messages" id="messages"></div>
    <div id="quick-replies-area"></div>
    <div id="human-form-area"></div>
  </div>

  <div class="input-bar">
    <div style="flex:1; display:flex; flex-direction:column; gap:0;">
      <div class="human-bar">
        Prefer a real person? <button onclick="showHumanForm()">Request a team member</button>
      </div>
      <div class="input-wrap">
        <textarea id="user-input" placeholder="Type a message..." rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      </div>
    </div>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>

</div>

<form name="reffy-transcript" netlify netlify-honeypot="bot-field" hidden>
  <input type="text" name="prospect_name" />
  <input type="text" name="contact_preference" />
  <input type="text" name="phone" />
  <input type="text" name="email" />
  <textarea name="transcript"></textarea>
  <input type="text" name="timestamp" />
</form>

<script>
  const BOOKING_LINK = "https://members.clubpilates.com/book/clubpilates-mission-valley-ca?classCategory=Intro%20Class";

  let messages = [];
  let isLoading = false;
  let quickRepliesShown = false;

  /* ── Render helpers ── */
  function addMessage(role, text) {
    messages.push({ role, content: text });
    renderMessage(role, text);
  }

  function renderMessage(role, text) {
    const container = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg-row ' + (role === 'user' ? 'user' : 'reffy');

    if (role !== 'user') {
      const av = document.createElement('div');
      av.className = 'avatar-sm';
      av.innerHTML = '<img src="reffy-avatar.png" alt="Reffy" style="width:100%;height:100%;object-fit:cover;object-position:center 20%;border-radius:50%;"/>';
      row.appendChild(av);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'reffy');
    bubble.innerHTML = formatText(text);
    row.appendChild(bubble);
    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
  }

  function formatText(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(
        /(https?:\/\/[^\s<]+)/g,
        `<a href="$1" target="_blank" rel="noopener">Click here to book your free Intro class →</a>`
      )
      .replace(/\n/g, '<br>');
  }

  function showTyping() {
    const container = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg-row reffy';
    row.id = 'typing-indicator';
    const av = document.createElement('div');
    av.className = 'avatar-sm';
    av.textContent = '🌸';
    row.appendChild(av);
    const bubble = document.createElement('div');
    bubble.className = 'bubble reffy';
    bubble.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
    row.appendChild(bubble);
    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  /* ── Quick replies ── */
  function showQuickReplies(replies) {
    const area = document.getElementById('quick-replies-area');
    area.innerHTML = '';
    if (!replies || replies.length === 0) return;
    const wrap = document.createElement('div');
    wrap.className = 'quick-replies';
    replies.forEach(r => {
      const btn = document.createElement('button');
      btn.className = 'qr-btn';
      btn.textContent = r;
      btn.onclick = () => { area.innerHTML = ''; sendUserMessage(r); };
      wrap.appendChild(btn);
    });
    area.appendChild(wrap);
  }

  /* ── API call (goes through Netlify function) ── */
  async function callReffy() {
    const res = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages }),
    });
    const data = await res.json();
    return data.reply || "Something glitched — try again!";
  }

  /* ── Send flow ── */
  async function sendUserMessage(text) {
    if (!text.trim() || isLoading) return;
    isLoading = true;
    document.getElementById('send-btn').disabled = true;
    document.getElementById('quick-replies-area').innerHTML = '';

    addMessage('user', text);
    showTyping();

    try {
      const reply = await callReffy();
      removeTyping();
      addMessage('assistant', reply);

      const lower = reply.toLowerCase();
      if (lower.includes('members.clubpilates.com') || lower.includes('book your free intro')) {
        const urlName = new URLSearchParams(window.location.search).get('name') || '';
        submitTranscript(urlName, 'booking link sent', '', '');
      }
      if (lower.includes('first time') || lower.includes('tried pilates') || lower.includes('brings you here') || lower.includes('what brings')) {
        showQuickReplies(["First time curious!", "I've tried Pilates before", "A friend recommended it", "Tell me more first"]);
      } else if (lower.includes('hoping') || lower.includes('help you with') || lower.includes('goal') || lower.includes('looking for')) {
        showQuickReplies(["Core strength & posture", "Back pain relief", "Toning & weight loss", "Stress relief & flexibility"]);
      } else if (lower.includes('injur') || lower.includes('limitation') || lower.includes('know about') || lower.includes('physical')) {
        showQuickReplies(["No injuries, all good!", "Lower back issues", "Knee problems", "Just want to know more"]);
      } else if (lower.includes('nervous') || lower.includes('intimidat') || lower.includes('scared') || lower.includes('worried')) {
        showQuickReplies(["A little nervous", "Pretty excited!", "Not sure what to expect", "Just want to try it"]);
      } else if (lower.includes('cost') || lower.includes('pric') || lower.includes('membership') || lower.includes('afford')) {
        showQuickReplies(["Tell me about memberships", "What does a single class cost?", "Is there a free trial?", "Let me book first"]);
      } else if (lower.includes('book') || lower.includes('intro class') || lower.includes('get started') || lower.includes('sign up')) {
        showQuickReplies(["Yes, I want to book!", "Tell me more first", "I have more questions", "Request a team member"]);
      }
    } catch (e) {
      removeTyping();
      addMessage('assistant', "Oops — something glitched on my end! Try sending that again.");
    }

    isLoading = false;
    document.getElementById('send-btn').disabled = false;
  }

  function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    sendUserMessage(text);
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  /* ── Human form ── */
  function showHumanForm() {
    const area = document.getElementById('human-form-area');
    if (area.querySelector('.human-form')) return;
    area.innerHTML = `
      <div class="human-form">
        <h4>Connect with our team 💙</h4>
        <input type="text"  id="hf-name"  placeholder="Your name" />
        <input type="tel"   id="hf-phone" placeholder="Phone number" />
        <input type="email" id="hf-email" placeholder="Email (optional)" />
        <p style="font-size:13px; color:#8A8580; margin-bottom:8px;">How would you prefer we reach out?</p>
        <div style="display:flex; gap:8px; margin-bottom:12px;">
          <label style="flex:1; display:flex; align-items:center; gap:7px; background:#FAF9F6; border:1px solid #E8E4DD; border-radius:8px; padding:9px 12px; cursor:pointer; font-size:13px; font-weight:500;">
            <input type="radio" name="contact-pref" value="text" checked style="accent-color:#4F7CAC; width:15px; height:15px;" /> Text me
          </label>
          <label style="flex:1; display:flex; align-items:center; gap:7px; background:#FAF9F6; border:1px solid #E8E4DD; border-radius:8px; padding:9px 12px; cursor:pointer; font-size:13px; font-weight:500;">
            <input type="radio" name="contact-pref" value="call" style="accent-color:#4F7CAC; width:15px; height:15px;" /> Call me
          </label>
        </div>
        <button class="submit-btn" onclick="submitHumanRequest()">Send my info to the studio</button>
      </div>`;
    area.scrollIntoView({ behavior: 'smooth' });
  }

  function submitHumanRequest() {
    const name  = document.getElementById('hf-name').value.trim();
    const phone = document.getElementById('hf-phone').value.trim();
    const prefEl = document.querySelector('input[name="contact-pref"]:checked');
    const pref = prefEl ? prefEl.value : 'text';
    if (!name || !phone) {
      alert('Please enter your name and phone number so we can reach you!');
      return;
    }
    const prefLabel = pref === 'call' ? 'give you a call' : 'send you a text';
    submitTranscript(name, pref, phone, document.getElementById('hf-email').value.trim());
    document.getElementById('human-form-area').innerHTML =
      `<div class="success-note">✓ Got it, ${name}! Someone from Club Pilates Mission Valley will ${prefLabel} within 24 hours. So excited to meet you!</div>`;
    addMessage('assistant', `Perfect! I've sent your info to the team, ${name}. They'll ${prefLabel} within 24 hours — they're so excited to meet you! 🎉`);
  }

  /* ── Init ── */
  async function init() {
    const rawName = new URLSearchParams(window.location.search).get('name') || '';
    const prospectName = rawName.charAt(0).toUpperCase() + rawName.slice(1).toLowerCase();
    showTyping();
    await new Promise(r => setTimeout(r, 1200));
    removeTyping();
    const greeting = prospectName
      ? `Hey ${prospectName}! 👋 I'm Reffy, your friendly guide here at Club Pilates Mission Valley. I'm here to answer any questions and help you figure out if Pilates might be a good fit for you — totally no pressure, just a casual chat. What brings you here today — are you curious about Pilates for the first time, or have you tried it before?`
      : "Hey there! 👋 I'm Reffy, your friendly guide here at Club Pilates Mission Valley. I'm here to answer any questions and help you figure out if Pilates might be a good fit for you — totally no pressure, just a casual chat. So what brings you here today — are you curious about Pilates for the first time, or have you tried it before?";
    addMessage('assistant', greeting);
    showQuickReplies(["First time curious!", "I've tried Pilates before", "A friend recommended it", "Tell me more first"]);
  }

  /* ── Submit transcript to Netlify Forms ── */
  async function submitTranscript(prospectName, contactPref, phone, email) {
    const transcript = messages
      .map(m => (m.role === 'user' ? 'PROSPECT: ' : 'REFFY: ') + m.content)
      .join('

');
    const formData = new FormData();
    formData.append('form-name', 'reffy-transcript');
    formData.append('prospect_name', prospectName || 'Unknown');
    formData.append('contact_preference', contactPref || 'Not specified');
    formData.append('phone', phone || 'Not provided');
    formData.append('email', email || 'Not provided');
    formData.append('transcript', transcript);
    formData.append('timestamp', new Date().toLocaleString('en-US', {timeZone: 'America/Los_Angeles'}));
    try {
      await fetch('/', { method: 'POST', body: formData });
    } catch(e) {
      console.log('Transcript submit error:', e);
    }
  }

  init();
</script>
</body>
</html>
